<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151618"><title>Auto Absen MagangHub</title>
<style>
:root{color-scheme:dark;--bg:#151618;--s1:#1e2023;--s2:#272a2e;--ln:#363a40;--ink:#eceef0;--mut:#9aa0a8;--g:#4ade80;--gd:#16a34a;--gb:rgba(74,222,128,.13);--w:#fbbf24;--wb:rgba(251,191,36,.13);--e:#f87171;--eb:rgba(248,113,113,.13);--bn:cubic-bezier(.34,1.56,.64,1);--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--m:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(700px 320px at 50% -100px,rgba(74,222,128,.1),transparent) no-repeat,var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:sp .8s linear infinite}
.mut,.f small{color:var(--mut)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}to{transform:scale(1);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.12)}}
@keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{50%{opacity:.3}}
@keyframes cf{50%{transform:translate(calc(var(--x)*.6),var(--y))}to{transform:translate(var(--x),150px) rotate(540deg);opacity:0}}
/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 var(--f);padding:12px 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;color:var(--ink);transition:transform .3s var(--bn),box-shadow .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:active:not(:disabled){transform:scale(.94)}.btn:disabled{opacity:.4;cursor:not-allowed}
.pri{background:var(--g);color:#06260f}.pri:hover:not(:disabled){box-shadow:0 6px 22px rgba(74,222,128,.32)}
.gho{background:var(--s2);border-color:var(--ln)}.gho:hover:not(:disabled){border-color:var(--g)}
.big{width:100%;padding:16px;font-size:16px}.sm{padding:8px 12px;font-size:13px}
.tx{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--f);color:var(--mut);background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;transition:color .2s,background .2s,transform .3s var(--bn)}
.tx:hover:not(:disabled){color:var(--ink);background:var(--s2);transform:translateY(-1px)}.tx:disabled{opacity:.4}
.ib{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:none;color:var(--mut);cursor:pointer;transition:color .2s,background .2s,transform .3s var(--bn)}
.ib:hover{color:var(--ink);background:var(--s2);transform:scale(1.1)}.ib:active{transform:scale(.9)}
#nb{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--g);color:#06260f;font:700 10px/16px var(--f);text-align:center;font-style:normal;animation:pop .5s var(--bn)}
/* form */
.f{display:block;margin-bottom:14px}.f>span{display:block;font-weight:500;margin-bottom:6px}
.in{position:relative;display:flex;align-items:center}.in>.ic{position:absolute;left:12px;width:18px;height:18px;color:var(--mut);pointer-events:none}.in>.ic~input{padding-left:40px}.in .ib{position:absolute;right:3px}#lp{padding-right:44px}
input:not([type=checkbox]),textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
input:hover,textarea:hover{border-color:#4a4f57}input:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px var(--gb)}
textarea{resize:vertical;min-height:72px}::placeholder{color:var(--mut);opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .f{margin:0}
.mono{font-family:var(--m);font-size:13.5px}
.sw{position:relative;display:flex;align-items:center;gap:14px;cursor:pointer}.sw>span:first-child{flex:1}.sw b{display:block;font-weight:600}.sw input{position:absolute;opacity:0}
.tk{width:52px;height:30px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);position:relative;transition:background .25s,border-color .25s}
.tk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .4s var(--bn),background .2s}
.sw input:checked+.tk{background:var(--gb);border-color:var(--g)}.sw input:checked+.tk::after{transform:translateX(22px);background:var(--g)}.sw input:focus-visible+.tk{outline:2px solid var(--g);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-bottom:14px}.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--g)}.chk small{display:block;font-size:12.5px;color:var(--mut)}
.err{display:flex;align-items:center;gap:8px;color:var(--e);font-size:14px;margin:0 0 12px}.err:empty{display:none}.err:not(:empty){animation:shake .4s}
/* kartu */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:18px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:15px}.card h3 .ic{width:18px;height:18px;color:var(--g)}.card h3 .btn{margin-left:auto}
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s,transform .7s var(--bn),border-color .25s}.rv.in{opacity:1;transform:none}.rv:hover{border-color:#464b53}
.cols>.rv:nth-child(2){transition-delay:.1s}.cols>.rv:nth-child(3){transition-delay:.2s}
.sh{display:flex;align-items:center;gap:10px;margin:36px 0 14px;font-size:18px;letter-spacing:-.01em}.sh .ib{margin-left:auto}
.tile{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--gb);color:var(--g)}.tile .ic{width:18px;height:18px}
/* login */
.login{max-width:420px;margin:0 auto;padding:8vh 16px 40px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--g);color:#06260f}.logo .ic{width:22px;height:22px}
.logo.big{width:64px;height:64px;border-radius:20px;animation:drop 1s var(--bn)}.logo.big .ic{width:34px;height:34px}
.login h1{margin:22px 0 6px;font-size:2rem;line-height:1.1;letter-spacing:-.03em}.login .card{margin-top:22px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px}.pills:empty{display:none}
.pill{font:12.5px var(--f);padding:5px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);color:var(--mut);cursor:pointer;transition:transform .3s var(--bn),color .2s,border-color .2s}.pill:hover{color:var(--g);border-color:var(--g);transform:translateY(-2px)}
/* header + nav */
.top{position:sticky;top:0;z-index:20;background:rgba(21,22,24,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.top>div{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}.tr{display:flex;align-items:center;gap:6px}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gb);color:var(--g);font-weight:700;overflow:hidden;border:2px solid var(--g)}.av img{width:100%;height:100%;object-fit:cover}
.nm{display:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:14px}
.nav{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;display:flex;gap:4px;padding:6px;background:rgba(39,42,46,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nav a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:16px;color:var(--mut);text-decoration:none;font-size:11.5px;font-weight:600;transition:color .2s,background .2s,transform .3s var(--bn)}
.nav a:hover{color:var(--ink)}.nav a:active{transform:scale(.92)}.nav a.on{background:var(--gb);color:var(--g)}.nav a.on .ic{animation:pop .5s var(--bn)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px calc(150px + env(safe-area-inset-bottom))}
.date{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--mut)}.date .ic{width:16px;height:16px}
/* hero */
.hero{position:relative;overflow:hidden;display:grid;gap:16px;grid-template-areas:"st" "run" "ch" "tl";background:linear-gradient(160deg,var(--s2),var(--s1) 65%)}
.st{grid-area:st;display:flex;gap:14px;align-items:center}#run{grid-area:run}.chips{grid-area:ch}.tools{grid-area:tl;display:flex;gap:4px;border-top:1px solid var(--ln);padding-top:12px}
.bd{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:var(--s2);color:var(--mut)}
.bd .ic{display:none;width:28px;height:28px}.bd[data-s=""] .il{display:block;animation:sp 1s linear infinite}
.bd[data-s=ok]{background:var(--gb);color:var(--g);animation:pop .7s var(--bn)}.bd[data-s=ok] .io,.bd[data-s=warn] .iw,.bd[data-s=err] .ie{display:block}
.bd[data-s=warn]{background:var(--wb);color:var(--w);animation:bob 2s ease-in-out infinite}.bd[data-s=err]{background:var(--eb);color:var(--e);animation:shake .5s}
.hero h1{margin:0;font-size:1.45rem;line-height:1.2;letter-spacing:-.02em}.hero p{margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{display:flex;align-items:center;gap:6px;padding:6px 11px;background:var(--bg);border:1px solid var(--ln);border-radius:99px;font-size:13px;color:var(--mut)}.chips .ic{width:15px;height:15px;color:var(--g)}.chips i{font-style:normal;color:var(--ink)}
.cf{position:absolute;left:50%;top:35%;width:8px;height:8px;border-radius:2px;background:var(--c);animation:cf 1.1s var(--d) ease-out forwards;pointer-events:none}
/* gamifikasi */
.gm{margin-top:14px;display:grid;gap:16px}
.lv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}.lv small{grid-column:2;color:var(--mut)}
.lvb{background:var(--g);color:#06260f;font-weight:800;font-size:13px;padding:4px 11px;border-radius:99px}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:4%;background:linear-gradient(90deg,var(--gd),var(--g));border-radius:9px;transition:width 1.1s var(--bn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats>div{display:grid;justify-items:center;gap:2px;padding:12px 6px;background:var(--bg);border:1px solid var(--ln);border-radius:16px;transition:transform .35s var(--bn),border-color .2s}.stats>div:hover{transform:translateY(-4px) scale(1.04);border-color:var(--g)}
.stats b{font-size:1.5rem;line-height:1.1}.stats small{font-size:12px;color:var(--mut)}.stats .ic{color:var(--g)}.stats .fl{color:var(--w);animation:wig 2.4s ease-in-out infinite;transform-origin:50% 90%}
.bdg{display:flex;flex-wrap:wrap;gap:8px}.bdg span{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12.5px;border:1px dashed var(--ln);color:var(--mut);opacity:.55;transition:transform .35s var(--bn)}
.bdg span.on{border:1px solid var(--g);background:var(--gb);color:var(--g);opacity:1;animation:pop .6s var(--bn)}.bdg span:hover{transform:scale(1.08) rotate(-2deg)}.bdg .ic{width:16px;height:16px}
/* pengaturan */
.cols{display:grid;gap:14px}
.sv{position:fixed;z-index:15;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;background:var(--s2);border:1px solid var(--g);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.55);transform:translateY(160%);opacity:0;pointer-events:none;transition:transform .5s var(--bn),opacity .2s}
.sv[data-d="1"]{transform:none;opacity:1;pointer-events:auto}.sv span{display:flex;align-items:center;gap:10px;font-size:14px}.sv i{width:8px;height:8px;border-radius:50%;background:var(--w);animation:blink 1.4s infinite}
/* riwayat */
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;font:600 13.5px var(--f);padding:9px;border:0;border-radius:9px;background:none;color:var(--mut);cursor:pointer;transition:background .2s,color .2s,transform .3s var(--bn)}.tabs button:active{transform:scale(.95)}.tabs .on{background:var(--s2);color:var(--g)}
.pane{max-height:340px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--ln) transparent;overscroll-behavior:contain}
.it{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--ln);animation:up .5s var(--bn) both;animation-delay:calc(var(--i)*45ms);transition:background .2s,padding .25s}.it:last-child{border:0}.it:hover{background:var(--s2);padding-left:12px;border-radius:12px}
.it>div{min-width:0}.it b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mut)}
.ico{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px}.ico .ic{width:18px;height:18px}.ico.ok{background:var(--gb);color:var(--g)}.ico.w{background:var(--wb);color:var(--w)}.ico.e{background:var(--eb);color:var(--e)}
.empty{text-align:center;color:var(--mut);padding:26px 8px}.empty .ic{width:30px;height:30px;margin-bottom:6px}
#pc{background:#0f1012;border-radius:12px;padding:12px}.cp{position:sticky;top:0;float:right}
.term{margin:0;font:12.5px/1.65 var(--m);white-space:pre-wrap;word-break:break-word;color:#cfd6d2}.term .ok{color:var(--g)}.term .bad{color:var(--e)}
.dbs{display:flex;align-items:center;gap:8px;margin:22px 0 0;font-size:13px;color:var(--mut)}.dbs::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}.dbs[data-s=ok]::before{background:var(--g)}.dbs[data-s=off]{color:var(--w)}.dbs[data-s=off]::before{background:var(--w)}
/* dialog + toast */
dialog{width:min(480px,calc(100% - 28px));background:var(--s1);color:var(--ink);border:1px solid var(--ln);border-radius:24px;padding:20px}dialog[open]{animation:pop .45s var(--bn)}dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
dialog form{margin:0}.dh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.dh h3{margin:0;font-size:17px}dialog p{margin:0}
dialog .term{background:#0f1012;border-radius:12px;padding:12px;max-height:45vh;overflow:auto;margin-top:12px}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;z-index:99;left:50%;top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;max-width:calc(100% - 28px);padding:11px 16px;background:var(--s2);border:1px solid var(--g);border-radius:14px;font-weight:500;font-size:14px;transform:translate(-50%,-180%);opacity:0;pointer-events:none;transition:transform .55s var(--bn),opacity .2s}
.toast.show{transform:translate(-50%,0);opacity:1}.toast .ic{color:var(--g)}.toast[data-t=err]{border-color:var(--e)}.toast[data-t=err] .ic{color:var(--e)}
/* desktop */
@media(min-width:820px){
.nm{display:block}.nav{top:9px;bottom:auto;width:380px;padding:4px;border-radius:16px}.nav a{grid-auto-flow:column;justify-content:center;gap:8px;padding:9px;font-size:13.5px}
.wrap{padding:28px 16px 120px}.sv{bottom:24px}
.hero{grid-template-columns:1fr 250px;grid-template-areas:"st run" "ch tl";align-items:center}.tools{border:0;padding:0;justify-content:flex-end}
.cols{grid-template-columns:1fr 1fr}.cols>:nth-child(2){grid-row:span 2}.gm{grid-template-columns:1fr 1fr;align-items:center}.gm .bdg,.gm .lv{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style></head><body>

<div id="vd" hidden>

</div></header>

<main class="wrap">
<section id="home">

<div class="card hero rv">
<div class="st"><div class="bd" id="bd" data-s=""><svg class="ic il"><use href="#i-loader"/></svg><svg class="ic io"><use href="#i-check-circle"/></svg><svg class="ic iw"><use href="#i-clock"/></svg><svg class="ic ie"><use href="#i-alert"/></svg></div>

<div class="chips"><span id="mt" hidden><svg class="ic"><use href="#i-user"/></svg><i id="vm"></i></span><span><svg class="ic"><use href="#i-pin"/></svg><i id="vl2">—</i></span><span><svg class="ic"><use href="#i-repeat"/></svg><i id="va">—</i></span></div>

</div>

<label class="f" style="margin:16px 0 0"><span>Jam pengambilalihan (WIB)</span><input type="time" id="it" min="13:00" max="20:00" value="13:30" style="max-width:150px"><small style="display:block;margin-top:6px">Batas aman 13:00 sampai 20:00. Disarankan 15:00 sampai 17:00.</small></label></div>
</div></section>

</form>

<dialog id="dg"><form method="dialog">
<div class="dh"><span class="tile"><svg class="ic"><use id="dgi" href="#i-send"/></svg></span><h3 id="dtt"></h3></div>
<p class="mut" id="dbd"></p><pre class="term" id="dp" hidden></pre>
<footer><button value="cancel" class="btn gho" id="dc">Batal</button><button value="ok" class="btn pri" id="dok">Lanjutkan</button></footer>
</form></dialog>
<div class="toast" id="ts" role="status"><svg class="ic"><use id="ti" href="#i-check"/></svg><span id="tm"></span></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const AK='maganghub_auth_session',SK='maganghub_user_suggestions',RK='maganghub_last_read_log',CRON='13:30',DEF={location:'Karawang',latitude:-6.370891,longitude:107.272352};
const BADGES=[[1,'Pemula','leaf'],[5,'Konsisten','flame'],[15,'Rajin','star'],[30,'Legenda','trophy']];
let auth=null,saved=null,logs=[];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const api=(ep,o={})=>fetch('/api/'+ep,{...o,headers:{'Content-Type':'application/json',...(auth?{'X-Auth-Username':auth.username,'X-Auth-Password':auth.password}:{}),...o.headers}}).then(async r=>{
 let d=null;try{d=await r.json()}catch(e){}
 if(r.status===401){expire();throw Object.assign(new Error('Sesi berakhir'),{code:401})}
 if(!r.ok)throw Object.assign(new Error(d&&d.message||'Server error ('+r.status+')'),{output:d&&d.output});
 return d});

$('#dt').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());

let tt;const toast=(m,t)=>{const e=$('#ts');$('#tm').textContent=m;$('#ti').setAttribute('href',t==='err'?'#i-alert':'#i-check');e.dataset.t=t||'';e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3200)};
const busy=(b,on,l)=>{if(on){b.dataset.h=b.innerHTML;b.innerHTML=ic('loader','spin')+'<span>'+l+'</span>'}else if(b.dataset.h!==undefined)b.innerHTML=b.dataset.h;b.disabled=on};
const hero=(s,t,d)=>{$('#bd').dataset.s=s;$('#ht').textContent=t;$('#hd').textContent=d||''};
const autoTxt=on=>on?'Aktif, '+CRON+' WIB':'Nonaktif';
const rlog=t=>{const b=$('#lc');b.textContent='';(t||'').split('\n').forEach(l=>{const d=document.createElement('div');d.textContent=l;if(/\[OK\]|berhasil|success/i.test(l))d.className='ok';else if(/error|gagal|fail|traceback|exception/i.test(l))d.className='bad';b.append(d)});$('#pc').scrollTop=1e6};

const dg=$('#dg');
const ask=o=>new Promise(r=>{$('#dtt').textContent=o.title;$('#dbd').textContent=o.body||'';$('#dbd').hidden=!o.body;$('#dp').hidden=!o.pre;$('#dp').textContent=o.pre||'';$('#dok').textContent=o.ok;$('#dc').hidden=!!o.info;$('#dgi').setAttribute('href','#i-'+(o.icon||'send'));dg.returnValue='';dg.addEventListener('close',()=>r(dg.returnValue==='ok'),{once:true});dg.showModal()});
dg.onclick=e=>{if(e.target===dg)dg.close()};

const burst=()=>{const h=$('.hero');for(let i=0;i<24;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`--x:${(Math.random()-.5)*340}px;--y:${-40-Math.random()*150}px;--c:${['#4ade80','#fbbf24','#eceef0','#16a34a'][i%4]};--d:${Math.random()*.2}s`;h.append(s);setTimeout(()=>s.remove(),1400)}};

/* form */
const raw=()=>({location:$('#il').value.trim(),latitude:$('#ia').value.trim().replace(',','.'),longitude:$('#io').value.trim().replace(',','.'),clock_in_time:$('#it').value||'13:30',activity_log:$('#a1').value.trim(),lesson_learned:$('#a2').value.trim(),obstacles:$('#a3').value.trim(),auto_absen:$('#au').checked});
const dirty=()=>saved!==null&&JSON.stringify(raw())!==saved;
const sync=()=>{const d=dirty();$('#sb').disabled=!d;$('#sv').dataset.d=d?1:0};
const data=()=>{const r=raw(),a=+r.latitude,o=+r.longitude,[h,m]=r.clock_in_time.split(':').map(Number);let e='';
 if(!r.location)e='Isi nama lokasi presensi.';
 else if(r.latitude===''||r.longitude===''||!isFinite(a)||!isFinite(o)||Math.abs(a)>90||Math.abs(o)>180)e='Koordinat tidak valid. Latitude -90 sampai 90, longitude -180 sampai 180.';
 else if(h<13||h*60+m>1200)e='Jam absen bot harus antara 13:00 dan 20:00 WIB.';
 if(e){toast(e,'err');return null}return{...r,latitude:a,longitude:o}};
const fill=v=>{$('#il').value=v.location;$('#ia').value=v.latitude;$('#io').value=v.longitude;$('#it').value=v.clock_in_time||'13:30';$('#a1').value=v.activity_log;$('#a2').value=v.lesson_learned;$('#a3').value=v.obstacles;$('#au').checked=v.auto_absen;saved=JSON.stringify(raw());sync()};
$('#fs').addEventListener('input',sync);$('#fs').addEventListener('change',sync);

/* akun & sesi */
const pills=()=>{const b=$('#pills');b.innerHTML='';try{JSON.parse(localStorage.getItem(SK)||'[]').forEach(u=>{const p=document.createElement('button');p.type='button';p.className='pill';p.textContent=u;p.onclick=()=>{$('#lu').value=u;$('#lp').focus()};b.append(p)})}catch(e){}};
const setErr=m=>{const b=$('#le');b.textContent='';if(m){b.insertAdjacentHTML('beforeend',ic('alert'));b.append(Object.assign(document.createElement('span'),{textContent:m}))}};
$('#pw').onclick=e=>{const p=$('#lp'),s=p.type==='password';p.type=s?'text':'password';$('#pwi').setAttribute('href',s?'#i-eyeoff':'#i-eye');e.currentTarget.setAttribute('aria-label',s?'Sembunyikan kata sandi':'Tampilkan kata sandi')};
const prof=p=>{if(!p)return;const n=p.name||auth&&auth.username||'',a=$('#av');
 if(n){$('#nm').textContent=n;a.title=n}
 if(p.photo_url){a.textContent='';const i=new Image();i.src=p.photo_url;i.alt=n;i.referrerPolicy='no-referrer';i.onerror=()=>{i.remove();a.textContent=(n||'?')[0].toUpperCase()};a.append(i)}else if(n)a.textContent=n[0].toUpperCase();
 if(p.mitra_name){$('#vm').textContent=p.mitra_name+(p.position?' / '+p.position:'');$('#mt').hidden=false}};
const dash=(u,p)=>{$('#vl').hidden=true;$('#vd').hidden=false;$('#nm').textContent=u;$('#av').textContent=(u||'?')[0].toUpperCase();prof(p);status()};
const login=m=>{$('#vd').hidden=true;$('#vl').hidden=false;setErr(m);$('#lp').value='';pills();$('#lu').focus()};
const clear=()=>{auth=null;localStorage.removeItem(AK);sessionStorage.removeItem(AK);$('#fs').reset();saved=null;logs=[];rlog('Memuat log…');hero('','Memeriksa status…','');$('#av').textContent='?';$('#nm').textContent='';$('#mt').hidden=true;$('#sv').dataset.d=0};
const expire=()=>{clear();login('Sesi berakhir. Silakan masuk kembali.')};

$('#fl').addEventListener('submit',e=>{e.preventDefault();
 const b=$('#bl'),username=$('#lu').value.trim(),password=$('#lp').value.trim();if(!username||!password)return;
 setErr('');busy(b,true,'Memverifikasi…');
 fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}).then(r=>r.json()).then(res=>{
  if(!res.status){setErr(res.message||'Login gagal. Periksa email dan kata sandi.');return}
  auth={username,password};
  try{const l=JSON.parse(localStorage.getItem(SK)||'[]').filter(u=>u!==username);l.unshift(username);localStorage.setItem(SK,JSON.stringify(l.slice(0,5)))}catch(x){}
  if($('#rm').checked)localStorage.setItem(AK,JSON.stringify(auth));else{sessionStorage.setItem(AK,JSON.stringify(auth));localStorage.removeItem(AK)}
  dash(username,res.profile);
 }).catch(()=>setErr('Tidak bisa terhubung ke server login. Coba lagi.')).finally(()=>busy(b,false))});

$('#out').onclick=async()=>{
 if(dirty()&&!await ask({title:'Keluar tanpa menyimpan?',body:'Ada perubahan pengaturan yang belum disimpan dan akan hilang.',ok:'Keluar',icon:'logout'}))return;
 clear();login();toast('Anda sudah keluar.')};

/* status, gamifikasi, riwayat */
function status(keep){return api('status').then(res=>{
 if(res.need_login){expire();return}
 const db=$('#db');db.dataset.s=res.db_connected?'ok':'off';
 $('#dbt').textContent=res.db_connected?'Database terhubung':'Database belum terhubung'+(res.db_message?': '+res.db_message:'');
 const line=(res.output||'').split('\n').find(l=>l.includes('Status:'))||'';
 if(res.is_attended)hero('ok','Sudah absen hari ini',line.trim());
 else hero('warn','Belum absen hari ini','Absen otomatis berjalan pukul '+CRON+' WIB, atau kirim sekarang.');
 prof(res.profile);
 const p=res.preferences||{},env=res.env||{},pick=(a,b,c)=>a!=null?a:(b!=null&&b!==''?b:c);
 const v={location:p.user_location||env.location||DEF.location,latitude:pick(p.user_latitude,env.latitude,DEF.latitude),longitude:pick(p.user_longitude,env.longitude,DEF.longitude),clock_in_time:p.user_clock_in_time||p.clock_in_time||'13:30',activity_log:p.user_activity_log||env.activity_log||'',lesson_learned:p.user_lesson_learned||env.lesson_learned||'',obstacles:p.user_obstacles||env.obstacles||'',auto_absen:pick(p.user_auto_absen,env.auto_absen,true)!==false};
 $('#vl2').textContent=v.location;$('#va').textContent=autoTxt(v.auto_absen);
 if(saved===null||!dirty())fill(v);
 if(res.output&&!keep)rlog(res.output);
 return loadLogs(res.is_attended);
}).catch(err=>{if(err.code===401)return;const m=err.output||err.message||'Gagal terhubung ke API.';hero('err','Status tidak terbaca',m);if(!keep)rlog(m)})}

function game(att){
 const S=new Set(logs.filter(l=>l.status==='SUCCESS'||/berhasil|success|sudah absen/i.test(l.message||'')).map(l=>String(l.date||l.created_at||'').slice(0,10)).filter(Boolean));
 const k=d=>d.toISOString().slice(0,10),t=new Date(new Date().toLocaleDateString('sv')+'T00:00:00Z');
 if(att)S.add(k(t));
 let n=0;const d=new Date(t),back=()=>{do d.setUTCDate(d.getUTCDate()-1);while([0,6].includes(d.getUTCDay()))};
 if(!S.has(k(d)))back();while(S.has(k(d))){n++;back()}
 const tot=S.size,lv=1+Math.floor(tot/5);
 $('#sk').textContent=n;$('#tt').textContent=tot;$('#xp').textContent=tot*10;$('#lv').textContent='Lv '+lv;
 $('#xb').style.width=Math.max(4,tot%5*20)+'%';$('#xt').textContent=(tot%5)+'/5 hari menuju Lv '+(lv+1);
 $('#bg').innerHTML=BADGES.map(([c,nm,i])=>`<span class="${tot>=c?'on':''}" title="${c} hari absen">${ic(i)}${nm}</span>`).join('')}

async function loadLogs(att){
 try{const r=await api('logs');logs=r&&r.logs||[]}catch(e){if(e.code===401)return;logs=[]}
 game(att);
 const lr=+localStorage.getItem(RK)||0,u=logs.filter(l=>(+l.log_id||0)>lr).length,nb=$('#nb');nb.hidden=!u;nb.textContent=u>9?'9+':u;
 $('#ph').innerHTML=logs.length?logs.map((l,i)=>{
  const m=l.message||'',ok=l.status==='SUCCESS'||/berhasil|success/i.test(m),w=/sudah absen|dilewati/i.test(m),
  c=ok?'ok':w?'w':'e',tx=ok?'Berhasil':w?'Dilewati':'Gagal',ts=String(l.created_at||l.date||'').replace('T',' ').slice(0,16);
  return `<div class="it" style="--i:${Math.min(i,8)}"><span class="ico ${c}">${ic(ok?'check-circle':w?'clock':'alert')}</span><div><b title="${esc(m)}">${esc(m.split('\n').filter(Boolean)[0]||'Eksekusi selesai')}</b><small>${tx}, ${esc(ts)} WIB</small></div></div>`}).join('')
  :`<div class="empty">${ic('bell')}<div><b>Belum ada riwayat</b></div><small>Hasil absen akan muncul di sini setelah cron ${CRON} WIB berjalan atau Anda menekan Absen sekarang.</small></div>`}

$('#rf').onclick=()=>{const b=$('#rf');busy(b,true,'Memeriksa…');status().finally(()=>{busy(b,false);toast('Status diperbarui')})};
$('#rl').onclick=()=>status(true);
$('#cp').onclick=()=>navigator.clipboard?navigator.clipboard.writeText($('#lc').innerText).then(()=>toast('Log disalin.'),()=>toast('Gagal menyalin log.','err')):toast('Browser tidak mendukung salin otomatis.','err');
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#ph').hidden=b.dataset.t!=='h';$('#pc').hidden=b.dataset.t!=='c'});
$('#bell').onclick=()=>{if(logs.length)localStorage.setItem(RK,String(Math.max(...logs.map(l=>+l.log_id||0))));$('#nb').hidden=true;$('.tabs button').click();$('#log').scrollIntoView()};

/* GPS */
$('#gps').onclick=()=>{
 if(!navigator.geolocation)return toast('Browser tidak mendukung geolokasi.','err');
 const b=$('#gps');busy(b,true,'Mencari…');
 navigator.geolocation.getCurrentPosition(async p=>{
  const{latitude:a,longitude:o}=p.coords;let n=$('#il').value.trim();
  try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?'+new URLSearchParams({lat:a,lon:o,format:'jsonv2',zoom:16,'accept-language':'id'}));if(r.ok){const d=await r.json(),x=d.address||{};n=d.name||x.village||x.suburb||x.city_district||x.city||x.county||n}}catch(e){}
  $('#il').value=n||'Lokasi saya';$('#ia').value=a.toFixed(6);$('#io').value=o.toFixed(6);sync();toast('Lokasi terdeteksi. Jangan lupa simpan.');busy(b,false)
 },e=>{busy(b,false);toast({1:'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini.',2:'Posisi tidak tersedia. Coba lagi dengan sinyal lebih baik.',3:'Waktu pencarian GPS habis.'}[e.code]||'Gagal mendeteksi lokasi.','err')},{enableHighAccuracy:true,timeout:10000})};

/* simpan, absen, simulasi */
$('#fs').addEventListener('submit',e=>{e.preventDefault();const d=data();if(!d)return;const b=$('#sb');busy(b,true,'Menyimpan…');
 api('save_settings',{method:'POST',body:JSON.stringify(d)}).then(r=>{saved=JSON.stringify(raw());$('#vl2').textContent=d.location;$('#va').textContent=autoTxt(d.auto_absen);toast(r&&r.message||'Pengaturan tersimpan.')})
 .catch(err=>{if(err.code!==401)toast('Gagal menyimpan: '+err.message,'err')}).finally(()=>{busy(b,false);sync()})});

$('#run').onclick=async()=>{const d=data();if(!d)return;
 if(!await ask({title:'Kirim presensi sekarang?',body:`Lokasi: ${d.location} (${d.latitude}, ${d.longitude}). Data pada form saat ini yang akan dikirim.`,ok:'Kirim presensi'}))return;
 const b=$('#run');busy(b,true,'Mengirim…');
 api('trigger',{method:'POST',body:JSON.stringify(d)}).then(r=>{toast(r.message||'Absen berhasil diproses.');if(r.output)rlog(r.output);burst()})
 .catch(err=>{if(err.code===401)return;toast(err.message||'Gagal menjalankan presensi.','err');if(err.output)rlog(err.output)})
 .finally(()=>{busy(b,false);status(true)})};

$('#dry').onclick=()=>{const d=data();if(!d)return;const b=$('#dry');busy(b,true,'Menyiapkan…');
 api('dry_run',{method:'POST',body:JSON.stringify(d)}).then(r=>ask({title:'Hasil simulasi payload absen',pre:r.output||'Tidak ada data.',ok:'Tutup',info:true,icon:'flask'}))
 .catch(err=>{if(err.code!==401)toast('Gagal mengambil data simulasi: '+err.message,'err')}).finally(()=>busy(b,false))};

window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});

/* scroll: muncul bertahap + penanda menu aktif */
const rv=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');rv.unobserve(x.target)}}),{threshold:.08});
$$('.rv').forEach(x=>rv.observe(x));
const spy=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)$$('.nav a').forEach(a=>a.classList.toggle('on',a.hash==='#'+x.target.id))}),{rootMargin:'-35% 0px -60% 0px'});
$$('main section').forEach(x=>spy.observe(x));

/* mulai */
try{const s=localStorage.getItem(AK)||sessionStorage.getItem(AK);if(s){auth=JSON.parse(s);dash(auth.username)}else login()}catch(e){login()}
})();
</script></body></html>
