<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Absen MagangHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EDF0EE;
            --surface: #FFFFFF;
            --field: #F6F8F7;
            --ink: #16201C;
            --muted: #5C6963;
            --line: #D9DFDC;
            --ok: #0B6E5A;
            --warn: #B45309;
            --err: #B42318;
            --term: #121A16;
            --term-ink: #CFE0D6;
            --sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0D1210;
                --surface: #151C19;
                --field: #101613;
                --ink: #E9F0EC;
                --muted: #92A199;
                --line: #26312C;
                --ok: #4FD1AE;
                --warn: #F2B35E;
                --err: #F97066;
                --term: #080C0A;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 15px/1.55 var(--sans);
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 28px 20px 64px;
        }

        :focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        /* Top bar */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 56px;
        }

        .brand {
            font-weight: 600;
            letter-spacing: -.01em;
        }

        .brand span {
            color: var(--muted);
            font-weight: 400;
        }

        .chip {
            font-size: 13px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 5px 12px;
        }

        /* Hero */
        .hero {
            margin-bottom: 56px;
        }

        .date {
            margin: 0 0 14px;
            color: var(--muted);
        }

        .hero h1 {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.4rem);
            line-height: 1.05;
            font-weight: 600;
            letter-spacing: -.035em;
        }

        .dot {
            flex: none;
            width: .36em;
            height: .36em;
            border-radius: 50%;
            background: var(--muted);
        }

        .dot[data-s="ok"] {
            background: var(--ok);
        }

        .dot[data-s="warn"] {
            background: var(--warn);
        }

        .dot[data-s="err"] {
            background: var(--err);
        }

        .detail {
            margin: 12px 0 0;
            min-height: 1.55em;
            color: var(--muted);
            max-width: 60ch;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 36px;
            margin: 28px 0;
        }

        .meta div {
            min-width: 0;
        }

        .meta dt {
            font-size: 13px;
            color: var(--muted);
        }

        .meta dd {
            margin: 0;
            font-weight: 500;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            padding: 11px 18px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: opacity .15s, border-color .15s;
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--ink);
            color: var(--surface);
        }

        .btn-primary:not(:disabled):hover {
            opacity: .88;
        }

        .btn-lg {
            padding: 14px 24px;
            font-size: 15px;
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            border-color: var(--line);
        }

        .btn-ghost:not(:disabled):hover {
            border-color: var(--ink);
        }

        /* Sections */
        .section {
            margin-top: 48px;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -.02em;
        }

        .hint {
            font-size: 13px;
            color: var(--muted);
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
        }

        textarea,
        input[type=time] {
            width: 100%;
            font: inherit;
            color: var(--ink);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 13px;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
            line-height: 1.6;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border-color: var(--ink);
        }

        .foot {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-top: 6px;
        }

        .foot .field {
            margin: 0;
            width: 170px;
        }

        /* Console */
        .term {
            margin: 0;
            background: var(--term);
            color: var(--term-ink);
            font: 400 12.5px/1.65 var(--mono);
            border-radius: 16px;
            padding: 18px 20px;
            max-height: 280px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Dialog + toast */
        dialog {
            width: min(560px, calc(100% - 32px));
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 0;
            background: var(--surface);
            color: var(--ink);
        }

        dialog::backdrop {
            background: rgba(10, 16, 13, .55);
        }

        dialog header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-weight: 600;
        }

        dialog .term {
            border-radius: 0;
            max-height: 50vh;
        }

        dialog footer {
            padding: 14px 20px;
            text-align: right;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            background: var(--ink);
            color: var(--surface);
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            transition: opacity .2s, transform .2s;
            max-width: calc(100% - 32px);
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast[data-t="err"] {
            background: var(--err);
            color: #fff;
        }

        @media (max-width:600px) {
            .top {
                margin-bottom: 40px;
            }

            .foot {
                flex-direction: column;
                align-items: stretch;
            }

            .foot .field {
                width: 100%;
            }

            .actions .btn-lg {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">

        <header class="top">
            <div class="brand">Auto Absen <span>MagangHub</span></div>
            <div class="chip" id="chip-time">Otomatis pukul 15:00 WIB</div>
        </header>

        <section class="hero" aria-live="polite">
            <p class="date" id="val-date">Memuat tanggal…</p>
            <h1><i class="dot" id="dot" data-s=""></i><span id="hero-title">Memeriksa status…</span></h1>
            <p class="detail" id="hero-detail"></p>

            <dl class="meta">
                <div>
                    <dt>Lokasi</dt>
                    <dd id="val-location">-</dd>
                </div>
                <div>
                    <dt>Absen otomatis</dt>
                    <dd id="val-time">15:00 WIB</dd>
                </div>
            </dl>

            <div class="actions">
                <button type="button" class="btn btn-primary btn-lg" id="btn-run-absen">Absen sekarang</button>
                <button type="button" class="btn btn-ghost btn-lg" id="btn-dry-run">Simulasi</button>
                <button type="button" class="btn btn-ghost btn-lg" id="btn-refresh-status">Perbarui status</button>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2>Catatan harian</h2>
                <span class="hint">Disinkronkan dari Environment Variables Vercel</span>
            </div>
            <form class="panel" id="form-activity">
                <div class="field">
                    <label for="activity_log">Aktivitas hari ini</label>
                    <textarea id="activity_log" name="activity_log" rows="4" placeholder="Apa yang kamu kerjakan hari ini?"></textarea>
                </div>
                <div class="field">
                    <label for="lesson_learned">Yang dipelajari</label>
                    <textarea id="lesson_learned" name="lesson_learned" rows="3" placeholder="Hal baru yang kamu pelajari"></textarea>
                </div>
                <div class="field">
                    <label for="obstacles">Kendala</label>
                    <textarea id="obstacles" name="obstacles" rows="3" placeholder="Hambatan yang kamu temui"></textarea>
                </div>
                <div class="foot">
                    <div class="field">
                        <label for="clock_in_time">Jam absen otomatis</label>
                        <input type="time" id="clock_in_time" name="clock_in_time" value="15:00">
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-save-log">Simpan catatan</button>
                </div>
            </form>
        </section>

        <section class="section">
            <div class="section-head">
                <h2>Riwayat eksekusi</h2>
                <button type="button" class="btn btn-ghost" id="btn-refresh-logs" style="padding:7px 14px">Muat ulang</button>
            </div>
            <pre class="term" id="log-console" tabindex="0">Memuat log…</pre>
            <p class="hint" style="margin:10px 0 0">Respons log terbaru dari serverless API</p>
        </section>
    </main>

    <dialog id="modalDryRun">
        <header>Hasil simulasi absen</header>
        <pre class="term" id="dry-run-content"></pre>
        <footer><button type="button" class="btn btn-ghost" id="btn-close-dry">Tutup</button></footer>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

    <script>
        (() => {
            const $ = s => document.querySelector(s);
            const api = (endpoint) => fetch('/api/' + endpoint).then(r => {
                if (!r.ok) return r.json().then(d => Promise.reject(d)).catch(() => Promise.reject(new Error(r.status)));
                return r.json();
            });

            // Format tanggal Indonesia
            $('#val-date').textContent = new Intl.DateTimeFormat('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).format(new Date());

            let toastTimer;
            function toast(msg, type) {
                const t = $('#toast');
                t.textContent = msg;
                t.dataset.t = type || '';
                t.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
            }

            function busy(btn, on, label) {
                if (on) {
                    btn.dataset.label = btn.textContent;
                    btn.textContent = label;
                } else {
                    btn.textContent = btn.dataset.label;
                }
                btn.disabled = on;
            }

            function setHero(state, title, detail) {
                $('#dot').dataset.s = state;
                $('#hero-title').textContent = title;
                $('#hero-detail').textContent = detail || '';
            }

            function checkStatus() {
                return api('status').then(res => {
                    if (!res.status) throw new Error('status');
                    const line = (res.output || '').split('\n').find(l => l.includes('Status:')) || '';
                    if (res.is_attended) {
                        setHero('ok', 'Sudah absen hari ini', line.trim());
                    } else {
                        const cTime = (res.env && res.env.clock_in_time) ? res.env.clock_in_time : '15:00';
                        setHero('warn', 'Belum absen hari ini', 'Absen otomatis berjalan pukul ' + cTime + ' WIB via Vercel Cron, atau kirim sekarang.');
                    }
                    if (res.env) {
                        if (res.env.location) $('#val-location').textContent = res.env.location;
                        if (res.env.clock_in_time) {
                            $('#val-time').textContent = res.env.clock_in_time + ' WIB';
                            $('#chip-time').textContent = 'Otomatis pukul ' + res.env.clock_in_time + ' WIB';
                            $('#clock_in_time').value = res.env.clock_in_time;
                        }
                        if (res.env.activity_log) $('#activity_log').value = res.env.activity_log;
                        if (res.env.lesson_learned) $('#lesson_learned').value = res.env.lesson_learned;
                        if (res.env.obstacles) $('#obstacles').value = res.env.obstacles;
                    }
                    if (res.output) {
                        $('#log-console').textContent = res.output;
                    }
                }).catch((err) => {
                    const msg = (err && err.output) ? err.output : 'Tidak bisa terhubung ke API Vercel.';
                    setHero('err', 'Status tidak terbaca', msg);
                    $('#log-console').textContent = msg;
                });
            }

            checkStatus();

            $('#btn-refresh-status').addEventListener('click', e => {
                const b = e.currentTarget;
                busy(b, true, 'Memeriksa…');
                checkStatus().finally(() => {
                    busy(b, false);
                    toast('Status diperbarui');
                });
            });

            $('#btn-refresh-logs').addEventListener('click', e => {
                const b = e.currentTarget;
                busy(b, true, 'Memuat…');
                checkStatus().finally(() => busy(b, false));
            });

            // Catatan harian di Cloud
            $('#form-activity').addEventListener('submit', e => {
                e.preventDefault();
                toast('Di Vercel, catatan disinkronkan via Project Settings > Environment Variables.');
            });

            // Absen manual
            $('#btn-run-absen').addEventListener('click', e => {
                if (!confirm('Kirim presensi sekarang?')) return;
                const b = e.currentTarget;
                busy(b, true, 'Mengirim…');
                api('cron')
                    .then(res => {
                        toast(res.message || 'Absen berhasil diproses!');
                        if (res.output) $('#log-console').textContent = res.output;
                    })
                    .catch(err => {
                        toast(err.message || 'Gagal menjalankan skrip.', 'err');
                        if (err.output) $('#log-console').textContent = err.output;
                    })
                    .finally(() => {
                        busy(b, false);
                        checkStatus();
                    });
            });

            // Simulasi
            const dlg = $('#modalDryRun');
            $('#btn-dry-run').addEventListener('click', e => {
                const b = e.currentTarget;
                busy(b, true, 'Menyiapkan…');
                api('dry_run')
                    .then(res => {
                        $('#dry-run-content').textContent = res.output || 'Tidak ada data.';
                        dlg.showModal();
                    })
                    .catch(() => toast('Gagal mengambil data simulasi.', 'err'))
                    .finally(() => busy(b, false));
            });
            $('#btn-close-dry').addEventListener('click', () => dlg.close());
            dlg.addEventListener('click', e => {
                if (e.target === dlg) dlg.close();
            });
        })();
    </script>
</body>

</html>
