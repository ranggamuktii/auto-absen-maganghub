name: Pengingat Absen

on:
  schedule:
    # 09:00 UTC = 16:00 WIB
    - cron: "0 9 * * *"
    # 14:00 UTC = 21:00 WIB
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Kirim pengingat bila belum absen
        run: python main.py remind
        env:
          SIAPKERJA_USERNAME: ${{ secrets.SIAPKERJA_USERNAME }}
          SIAPKERJA_PASSWORD: ${{ secrets.SIAPKERJA_PASSWORD }}
          ACTIVITY_LOG: ${{ secrets.ACTIVITY_LOG }}
          LESSON_LEARNED: ${{ secrets.LESSON_LEARNED }}
          OBSTACLES: ${{ secrets.OBSTACLES }}
          HARI_LIBUR: Sabtu,Minggu
          LIBUR_NASIONAL: "true"
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
